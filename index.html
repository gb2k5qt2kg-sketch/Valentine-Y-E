<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>14 février 💖</title>
</head>

<body bgcolor="#ffe6ee">
  <center>
    <br>
    <font face="Arial">

      <h2>Emma, j’ai une question pour toi 💘</h2>

      <div id="ytBox" hidden>
        <iframe id="ytFrame" width="360" height="215" src="" title="Die For You" frameborder="0" allow="autoplay" allowfullscreen></iframe>
        <br>
        <button id="soundBtn" onclick="enableSound()">Activer le son</button>
        <button id="openBtn" onclick="openYouTube()">Ouvrir sur YouTube</button>
      </div>

      <br><br>

      <div id="app">
        <h3>Veux tu être ma Valentine 💖</h3>
        <button onclick="start()">Oui</button>
        <button id="noBtn" onmouseover="moveNo()">Non</button>
      </div>

      <div id="result"></div>

    </font>
  </center>

<script>
function ch(n){ return String['fromCharCode'](n) }

var dot = ch(46)
var colon = ch(58)
var slash = ch(47)

var proto = 'https' + colon + slash + slash
var yHost = 'www' + dot + 'youtube' + dot + 'com'
var yWatch = proto + yHost + slash + 'watch' + '?v=YQ-qToZUybM'
var yEmbedMuted = proto + yHost + slash + 'embed' + slash + 'YQ-qToZUybM' + '?autoplay=1&mute=1'
var yEmbedSound = proto + yHost + slash + 'embed' + slash + 'YQ-qToZUybM' + '?autoplay=1&mute=0'

var step = 0
var chosenDay = ''
var chosenFood = ''

var imgParc = dot + slash + 'IMG_2031' + dot + 'webp'
var imgMusee = dot + slash + 'IMG_2032' + dot + 'webp'
var imgNetflix = dot + slash + 'IMG_2030' + dot + 'webp'
var imgPates = dot + slash + 'IMG_2033' + dot + 'jpeg'
var imgFrites = dot + slash + 'IMG_2034' + dot + 'jpeg'

function byId(id){ return document['getElementById'](id) }

function moveNo(){
  var btn = byId('noBtn')
  var x = Math['random']() * (window['innerWidth'] - 140)
  var y = Math['random']() * (window['innerHeight'] - 80)
  btn['style']['position'] = 'absolute'
  btn['style']['left'] = x + 'px'
  btn['style']['top'] = y + 'px'
}

function start(){
  step = 1
  showMusic()
  render()
}

function showMusic(){
  var box = byId('ytBox')
  box['hidden'] = false
  byId('ytFrame')['src'] = yEmbedMuted
}

function enableSound(){
  byId('ytFrame')['src'] = yEmbedSound
}

function openYouTube(){
  window['open'](yWatch, '_blank')
}

function pickDay(v){
  chosenDay = v
  step = 2
  render()
}

function pickFood(v){
  chosenFood = v
  step = 3
  render()
}

function cardButton(label, imgSrc, onClick){
  return ''
  + '<button onclick="' + onClick + '">'
  + '<img src="' + imgSrc + '" width="280" height="170" alt="' + label + '">'
  + '<br>'
  + label
  + '</button>'
}

function render(){
  var app = byId('app')
  var result = byId('result')

  if(step === 1){
    app['innerHTML'] = ''
    result['innerHTML'] = ''
    + '<h3>Le 14 février, tu as envie de quoi la journée 💞</h3>'
    + cardButton('Parc', imgParc, "pickDay('Parc')")
    + '<br><br>'
    + cardButton('Musée', imgMusee, "pickDay('Musée')")
    + '<br><br>'
    + cardButton('Netflix Outer Banks', imgNetflix, "pickDay('Netflix Outer Banks')")
  }

  if(step === 2){
    result['innerHTML'] = ''
    + '<h3>Et le soir, tu préfères quoi au resto 💞</h3>'
    + cardButton('Pâtes', imgPates, "pickFood('Pâtes')")
    + '<br><br>'
    + cardButton('Frites', imgFrites, "pickFood('Frites')")
  }

  if(step === 3){
    result['innerHTML'] = ''
    + '<h2>Parfait 💘</h2>'
    + '<p>Journée ' + chosenDay + '</p>'
    + '<p>Au resto ' + chosenFood + '</p>'
    + '<p>Je t’aime ❤️</p>'
  }
}
</script>

</body>
</html>
