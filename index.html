<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>14 février 💖</title>

  <style>
    body {
      background: #ffe6ee;
      font-family: Arial, sans-serif;
      margin: 0;
    }
    .wrap {
      max-width: 900px;
      margin: auto;
      padding: 30px 16px 60px;
      text-align: center;
    }
    h2 { margin-bottom: 8px; }
    h3 { margin: 22px 0 12px; }
    .sub { opacity: 0.85; margin-bottom: 16px; }

    .cardRow {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      justify-content: center;
      margin-top: 10px;
    }

    .cardBtn {
      width: 180px;
      background: white;
      border: none;
      border-radius: 18px;
      padding: 10px;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      transition: transform .1s;
    }
    .cardBtn:hover { transform: translateY(-2px); }

    .cardBtn img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 14px;
    }

    .cardTitle {
      margin-top: 8px;
      font-weight: bold;
    }

    .smallBtn {
      padding: 10px 16px;
      border-radius: 999px;
      border: none;
      cursor: pointer;
      background: white;
      box-shadow: 0 6px 14px rgba(0,0,0,0.08);
    }

    .pink {
      background: #ff3f86;
      color: white;
    }

    #ytBox {
      display: none;
      margin: 20px auto;
      max-width: 560px;
    }

    iframe {
      width: 100%;
      height: 315px;
      border-radius: 16px;
      background: black;
    }

    .finalBox {
      background: rgba(255,255,255,0.9);
      border-radius: 20px;
      padding: 20px;
      display: inline-block;
      box-shadow: 0 8px 18px rgba(0,0,0,0.08);
      margin-top: 16px;
    }
  </style>
</head>

<body>
<div class="wrap">

  <h2>Emma, j’ai une question pour toi 💘</h2>

  <div id="ytBox">
    <div class="sub">Avant de répondre, écoute ça si tu peux 🎶</div>
    <iframe id="ytFrame"
      src=""
      allow="autoplay; encrypted-media; picture-in-picture"
      allowfullscreen>
    </iframe>
    <div style="margin-top:10px">
      <button class="smallBtn" onclick="unmuteYT()">Activer le son</button>
    </div>
  </div>

  <div id="app">
    <h3>Veux-tu être ma Valentine 💖</h3>
    <button class="smallBtn pink" onclick="start()">Oui</button>
    <button class="smallBtn" id="noBtn" onmouseover="moveNo()">Non</button>
  </div>

  <div id="result"></div>

</div>

<script>
let step = 0
let chosenDay = ""
let chosenFood = ""

function moveNo() {
  const btn = document.getElementById("noBtn")
  btn.style.position = "absolute"
  btn.style.left = Math.random() * (window.innerWidth - 140) + "px"
  btn.style.top = Math.random() * (window.innerHeight - 70) + "px"
}

function start() {
  document.getElementById("ytBox").style.display = "block"
  document.getElementById("ytFrame").src =
    "https://www.youtube.com/embed/YQ-qToZUybM?autoplay=1&mute=1"
  step = 1
  render()
}

function unmuteYT() {
  document.getElementById("ytFrame").src =
    "https://www.youtube.com/embed/YQ-qToZUybM?autoplay=1"
}

function pickDay(v) {
  chosenDay = v
  step = 2
  render()
}

function pickFood(v) {
  chosenFood = v
  step = 3
  render()
}

function render() {
  const app = document.getElementById("app")
  const result = document.getElementById("result")
  app.innerHTML = ""

  if (step === 1) {
    result.innerHTML =
      "<h3>Le 14 février, tu as envie de quoi la journée 💕</h3>" +
      "<div class='cardRow'>" +

      "<button class='cardBtn' onclick=\"pickDay('Parc')\">" +
      "<img src='https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?auto=format&fit=crop&w=800&q=60'>" +
      "<div class='cardTitle'>Parc</div></button>" +

      "<button class='cardBtn' onclick=\"pickDay('Cinéma')\">" +
      "<img src='https://images.unsplash.com/photo-1489599849927-2ee91cede3ba?auto=format&fit=crop&w=800&q=60'>" +
      "<div class='cardTitle'>Cinéma</div></button>" +

      "<button class='cardBtn' onclick=\"pickDay('Musée')\">" +
      "<img src='https://images.unsplash.com/photo-1505842465776-3d90f616310d?auto=format&fit=crop&w=800&q=60'>" +
      "<div class='cardTitle'>Musée</div></button>" +

      "<button class='cardBtn' onclick=\"pickDay('Netflix')\">" +
      "<img src='https://images.unsplash.com/photo-1587825140708-dfaf72ae4b04?auto=format&fit=crop&w=800&q=60'>" +
      "<div class='cardTitle'>Outer Banks</div></button>" +

      "</div>"
  }

  if (step === 2) {
    result.innerHTML =
      "<h3>Le soir, petit resto 💘</h3>" +
      "<div class='cardRow'>" +

      "<button class='cardBtn' onclick=\"pickFood('Frites')\">" +
      "<img src='https://images.unsplash.com/photo-1541592106381-b31e9677c0e5?auto=format&fit=crop&w=800&q=60'>" +
      "<div class='cardTitle'>Frites</div></button>" +

      "<button class='cardBtn' onclick=\"pickFood('Pâtes')\">" +
      "<img src='https://images.unsplash.com/photo-1603133872878-684f208fb84b?auto=format&fit=crop&w=800&q=60'>" +
      "<div class='cardTitle'>Pâtes</div></button>" +

      "</div>"
  }

  if (step === 3) {
    result.innerHTML =
      "<div class='finalBox'>" +
      "<h2>Parfait 💖</h2>" +
      "<p>Journée " + chosenDay + "</p>" +
      "<p>Le soir resto et " + chosenFood + "</p>" +
      "<p>Je t’aime ❤️</p>" +
      "</div>"
  }
}
</script>

</body>
</html>
