<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>14 février 💖</title>

  <style>
    body{
      margin:0;
      font-family: Arial, sans-serif;
      background:#ffe6ee;
      color:#111;
    }
    .wrap{
      max-width:980px;
      margin:0 auto;
      padding:28px 16px 60px;
      text-align:center;
    }
    h1,h2,h3{ margin:10px 0; }
    .sub{ opacity:.85; margin-top:6px; }

    .ytBox{
      display:none;
      margin:18px auto 6px;
      max-width:760px;
    }
    .ytFrame{
      width:100%;
      aspect-ratio:16/9;
      border-radius:18px;
      border:0;
      box-shadow: 0 10px 28px rgba(0,0,0,.10);
      overflow:hidden;
      background:#000;
    }
    .btn{
      display:inline-block;
      padding:10px 16px;
      border-radius:999px;
      border:0;
      cursor:pointer;
      background:#ffffff;
      box-shadow: 0 6px 18px rgba(0,0,0,.08);
      margin:6px 6px;
      font-weight:600;
    }
    .btnYes{
      background:#ff4f8b;
      color:#fff;
    }
    .btnSmall{
      font-size:14px;
      padding:9px 14px;
      background:#ffffff;
    }
    .grid{
      display:grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap:14px;
      margin-top:14px;
    }
    @media (max-width:860px){
      .grid{ grid-template-columns: repeat(2, minmax(0, 1fr)); }
    }
    .card{
      background:#fff;
      border-radius:18px;
      padding:10px;
      box-shadow: 0 10px 26px rgba(0,0,0,.07);
      cursor:pointer;
      user-select:none;
      transition: transform .10s ease;
    }
    .card:active{ transform: scale(.98); }
    .thumb{
      width:100%;
      height:130px;
      object-fit:cover;
      border-radius:14px;
      background:#f3f3f3;
      display:block;
    }
    .label{
      margin-top:9px;
      font-weight:700;
      color:#1b7bbf;
    }
    .resultBox{
      margin-top:18px;
    }
    .love{
      margin-top:14px;
      font-size:18px;
      font-weight:700;
    }
    #noBtn{
      position:relative;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h2>Emma, j’ai une question pour toi 💘</h2>

    <div id="ytBox" class="ytBox">
      <div class="sub">Avant de répondre, écoute ça si tu peux 🎶</div>
      <iframe
        id="ytFrame"
        class="ytFrame"
        src=""
        title="Die For You"
        allow="autoplay; encrypted-media; picture-in-picture"
        allowfullscreen>
      </iframe>
      <div style="margin-top:10px;">
        <button class="btn btnSmall" onclick="activateSound()">Activer le son</button>
      </div>
      <div class="sub">Si ça reste en muet, touche Activer le son, c’est normal</div>
    </div>

    <div id="app" style="margin-top:18px;">
      <h3>Veux tu être ma Valentine 💖</h3>
      <button class="btn btnYes" onclick="startYes()">Oui</button>
      <button class="btn" id="noBtn" onmouseover="moveNo()">Non</button>
    </div>

    <div id="result" class="resultBox"></div>
  </div>

<script>
let step = 0
let chosenDay = ""
let chosenFood = ""

const images = {
  parc: "https://upload.wikimedia.org/wikipedia/commons/thumb/b/b9/Parc_des_Bastions.jpg/800px-Parc_des_Bastions.jpg",
  cinema: "https://images.unsplash.com/photo-1517604931442-7e0c8ed2963c?auto=format&fit=crop&w=1200&q=80",
  museum: "https://upload.wikimedia.org/wikipedia/commons/thumb/6/61/Mus%C3%A9e_d%27art_et_d%27histoire_%28Gen%C3%A8ve%29_01.jpg/800px-Mus%C3%A9e_d%27art_et_d%27histoire_%28Gen%C3%A8ve%29_01.jpg",
  netflix: "https://images.unsplash.com/photo-1574375927938-d5a98e8ffe85?auto=format&fit=crop&w=1200&q=80",
  fries: "https://images.unsplash.com/photo-1571091718767-18b5b1457add?auto=format&fit=crop&w=1200&q=80",
  pasta: "https://upload.wikimedia.org/wikipedia/commons/thumb/0/0a/A_plate_of_red_sauce_pasta.jpg/800px-A_plate_of_red_sauce_pasta.jpg"
}

function moveNo() {
  const btn = document.getElementById("noBtn")
  const x = Math.random() * (window.innerWidth - 140)
  const y = Math.random() * (window.innerHeight - 80)
  btn.style.position = "absolute"
  btn.style.left = x + "px"
  btn.style.top = y + "px"
}

function startYes() {
  // Affiche et lance la musique au clic sur Oui
  const ytBox = document.getElementById("ytBox")
  const ytFrame = document.getElementById("ytFrame")
  ytBox.style.display = "block"

  // Note: autoplay avec son est bloqué, on tente autoplay muet
  ytFrame.src = "https://www.youtube.com/embed/YQ-qToZUybM?autoplay=1&mute=1&rel=0"

  step = 1
  render()
  window.scrollTo({ top: 0, behavior: "smooth" })
}

function activateSound(){
  const ytFrame = document.getElementById("ytFrame")
  // recharge en non muet, parfois l utilisateur doit recliquer Play
  ytFrame.src = "https://www.youtube.com/embed/YQ-qToZUybM?autoplay=1&mute=0&rel=0"
}

function pickDay(v) {
  chosenDay = v
  step = 2
  render()
}

function pickFood(v) {
  chosenFood = v
  step = 3
  render()
}

function render() {
  const result = document.getElementById("result")

  if (step === 1) {
    result.innerHTML =
      "<h3>Le 14 février, tu as envie de quoi la journée 💞</h3>" +
      "<div class='grid'>" +
        cardHTML("Parc des Bastions", images.parc, "pickDay('Parc des Bastions')") +
        cardHTML("Cinéma", images.cinema, "pickDay('Cinéma')") +
        cardHTML(\"Musée d art et d histoire\", images.museum, \"pickDay('Musée')\") +
        cardHTML(\"Outer Banks\", images.netflix, \"pickDay('Outer Banks')\") +
      "</div>"
  }

  if (step === 2) {
    result.innerHTML =
      "<h3>Et le soir, on va au resto 💖</h3>" +
      "<div class='sub'>Tu veux manger quoi</div>" +
      "<div class='grid' style='grid-template-columns: repeat(2, minmax(0, 1fr)); max-width:560px; margin-left:auto; margin-right:auto;'>" +
        cardHTML("Frites", images.fries, "pickFood('Frites')") +
        cardHTML("Pâtes", images.pasta, "pickFood('Pâtes')") +
      "</div>"
  }

  if (step === 3) {
    result.innerHTML =
      "<h2>Parfait 💘</h2>" +
      "<p><b>Journée</b> " + escapeHtml(chosenDay) + "</p>" +
      "<p><b>Soir</b> resto</p>" +
      "<p><b>Manger</b> " + escapeHtml(chosenFood) + "</p>" +
      "<div class='love'>Je t’aime ❤️</div>"
  }
}

function cardHTML(label, img, onclickJs){
  return (
    "<div class='card' onclick=\"" + onclickJs + "\">" +
      "<img class='thumb' src='" + img + "' alt=''>" +
      "<div class='label'>" + label + "</div>" +
    "</div>"
  )
}

function escapeHtml(s){
  return String(s).replace(/[&<>\"']/g, c => ({
    "&":"&amp;",
    "<":"&lt;",
    ">":"&gt;",
    "\"":"&quot;",
    "'":"&#39;"
  })[c])
}
</script>

</body>
</html>
