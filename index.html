<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>14 février 💖</title>

  <style>
    body {
      background: #ffe6ee;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    .cards {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      flex-wrap: wrap;
    }

    .card {
      background: white;
      border-radius: 16px;
      padding: 10px;
      width: 180px;
      cursor: pointer;
      box-shadow: 0 6px 16px rgba(0,0,0,0.15);
      transition: transform 0.2s;
    }

    .card:hover {
      transform: scale(1.05);
    }

    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 12px;
    }

    button {
      padding: 10px 20px;
      border-radius: 20px;
      border: none;
      cursor: pointer;
      font-size: 16px;
    }

    #noBtn {
      position: relative;
    }
  </style>
</head>

<body>

<h2>Emma, j’ai une question pour toi 💘</h2>

<div id="app">
  <h3>Veux tu être ma Valentine 💖</h3>
  <button onclick="start()">Oui</button>
  <button id="noBtn" onmouseover="moveNo()">Non</button>
</div>

<div id="result"></div>

<script>
let step = 0
let chosenDay = ""
let chosenFood = ""

function moveNo() {
  const btn = document.getElementById("noBtn")
  btn.style.position = "absolute"
  btn.style.left = Math.random() * (window.innerWidth - 100) + "px"
  btn.style.top = Math.random() * (window.innerHeight - 50) + "px"
}

function start() {
  step = 1
  render()
}

function pickDay(v) {
  chosenDay = v
  step = 2
  render()
}

function pickFood(v) {
  chosenFood = v
  step = 3
  render()
}

function render() {
  const app = document.getElementById("app")
  const result = document.getElementById("result")

  app.innerHTML = ""

  if (step === 1) {
    result.innerHTML = `
      <h3>Le 14 février, tu as envie de quoi la journée 💕</h3>
      <div class="cards">
        <div class="card" onclick="pickDay('Parc')">
          <img src="images/parc.jpg">
          <p>Parc</p>
        </div>
        <div class="card" onclick="pickDay('Cinéma')">
          <img src="images/cinema.jpg">
          <p>Cinéma</p>
        </div>
        <div class="card" onclick="pickDay('Musée')">
          <img src="images/musee.jpg">
          <p>Musée</p>
        </div>
        <div class="card" onclick="pickDay('Netflix')">
          <img src="images/netflix.jpg">
          <p>Netflix</p>
        </div>
      </div>
    `
  }

  if (step === 2) {
    result.innerHTML = `
      <h3>Et pour manger au resto 💖</h3>
      <div class="cards">
        <div class="card" onclick="pickFood('Frites')">
          <img src="images/frites.jpg">
          <p>Frites</p>
        </div>
        <div class="card" onclick="pickFood('Pâtes')">
          <img src="images/pates.jpg">
          <p>Pâtes</p>
        </div>
      </div>
    `
  }

  if (step === 3) {
    result.innerHTML = `
      <h2>Parfait 💘</h2>
      <p>Journée : ${chosenDay}</p>
      <p>Repas : ${chosenFood}</p>
      <p>Je t’aime ❤️</p>
    `
  }
}
</script>

</body>
</html>
